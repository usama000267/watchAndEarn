<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Watch & Earn Dashboard</title>

<style>
*{
    box-sizing:border-box;
}

body{
    margin:0;
    background:#f5f7fb;
    color:#0f172a;
    font-family:Arial,sans-serif;
}

.dashboard{
    max-width:1150px;
    margin:auto;
    padding:18px 15px 95px;
}

/* ================= TOP BAR ================= */

.top-actions{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:18px;
}

.brand{
    font-size:22px;
    font-weight:800;
    color:#0f172a;
}

.brand span{
    color:#2563eb;
}

.logout-btn,
.back-btn{
    border:0;
    padding:10px 16px;
    border-radius:10px;
    cursor:pointer;
    font-weight:700;
}

.logout-btn{
    background:#fee2e2;
    color:#dc2626;
}

.back-btn{
    background:#eff6ff;
    color:#2563eb;
}

/* ================= HEADER ================= */

.dashboard-header{
    background:linear-gradient(135deg,#2563eb,#1d4ed8);
    color:white;
    padding:27px;
    border-radius:22px;
    margin-bottom:18px;
    box-shadow:0 10px 28px rgba(37,99,235,.18);
}

.dashboard-header h1{
    margin:0 0 7px;
    font-size:27px;
}

.dashboard-header p{
    margin:0;
    opacity:.9;
    font-size:14px;
}

/* ================= STATS ================= */

.stats-grid{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:14px;
    margin-bottom:18px;
}

.stat-card{
    background:white;
    border:1px solid #e5e7eb;
    border-radius:17px;
    padding:18px;
    box-shadow:0 7px 22px rgba(15,23,42,.05);
}

.stat-icon{
    font-size:24px;
    margin-bottom:9px;
}

.stat-card small{
    display:block;
    color:#64748b;
    margin-bottom:5px;
}

.stat-card strong{
    font-size:20px;
}

/* ================= CONTENT ================= */

.content-grid{
    display:grid;
    grid-template-columns:1.35fr .85fr;
    gap:18px;
}

.panel{
    background:white;
    border:1px solid #e5e7eb;
    border-radius:20px;
    padding:21px;
    box-shadow:0 7px 22px rgba(15,23,42,.05);
}

.panel h2{
    margin:0 0 6px;
    font-size:19px;
}

.panel-subtitle{
    color:#64748b;
    font-size:13px;
    margin-bottom:18px;
}

/* ================= ACCOUNT ================= */

.user-row{
    display:flex;
    justify-content:space-between;
    gap:15px;
    padding:12px 0;
    border-bottom:1px solid #eef2f7;
}

.user-row span{
    color:#64748b;
    font-size:13px;
}

.user-row strong{
    font-size:13px;
    text-align:right;
    word-break:break-word;
}

.status-active{
    color:#16a34a!important;
}

.status-inactive{
    color:#dc2626!important;
}

/* ================= ACTIONS ================= */

.action-grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:11px;
}

.action-btn{
    display:flex;
    align-items:center;
    justify-content:center;
    width:100%;
    min-height:52px;
    border:0;
    text-decoration:none;
    background:#eff6ff;
    color:#2563eb;
    padding:13px 10px;
    border-radius:12px;
    text-align:center;
    font-weight:700;
    cursor:pointer;
    transition:.2s;
}

.action-btn:hover{
    background:#dbeafe;
    transform:translateY(-1px);
}

/* Main four buttons */

.main-action{
    min-height:78px;
    flex-direction:column;
    gap:5px;
    font-size:14px;
    background:#f8fafc;
    border:1px solid #e2e8f0;
}

.main-action .action-icon{
    font-size:25px;
}

.main-action:hover{
    background:#eff6ff;
    border-color:#bfdbfe;
}

/* ================= ACTIVATION ================= */

.activate-btn{
    display:block;
    width:100%;
    margin-top:14px;
    border:0;
    background:#f97316;
    color:white;
    padding:14px;
    border-radius:11px;
    text-align:center;
    font-weight:800;
    text-decoration:none;
    cursor:pointer;
}

.activation-box{
    margin-top:18px;
    padding:15px;
    border-radius:14px;
    background:#fff7ed;
    border:1px solid #fed7aa;
}

.activation-box h3{
    margin:0 0 7px;
    color:#c2410c;
    font-size:15px;
}

.activation-box p{
    margin:0;
    color:#9a3412;
    font-size:12px;
    line-height:1.6;
}

.activation-active{
    background:#f0fdf4;
    border-color:#bbf7d0;
}

.activation-active h3,
.activation-active p{
    color:#15803d;
}

/* ================= TASKS ================= */

.task-card{
    background:#fff;
    border:1px solid #e5e7eb;
    border-radius:17px;
    padding:18px;
    margin-bottom:13px;
}

.task-card h3{
    margin:0 0 9px;
    font-size:17px;
}

.task-info{
    color:#64748b;
    font-size:13px;
    margin-bottom:14px;
}

.watch-btn,
.claim-btn{
    width:100%;
    border:0;
    padding:13px;
    border-radius:11px;
    font-weight:800;
    cursor:pointer;
}

.watch-btn{
    background:#2563eb;
    color:white;
}

.watch-btn:disabled,
.claim-btn:disabled{
    background:#94a3b8;
    cursor:not-allowed;
}

.claim-btn{
    background:#16a34a;
    color:white;
    margin-top:10px;
}

.timer-box{
    display:none;
    margin-top:12px;
    padding:13px;
    border-radius:11px;
    background:#eff6ff;
    color:#1d4ed8;
    text-align:center;
    font-weight:700;
}

.video-box{
    display:none;
    margin-top:15px;
}

.video-box iframe{
    width:100%;
    height:315px;
    border:0;
    border-radius:13px;
}

.claim-area{
    display:none;
    margin-top:12px;
}

.success-message{
    display:none;
    margin-top:10px;
    padding:12px;
    border-radius:10px;
    background:#f0fdf4;
    color:#15803d;
    font-size:13px;
    font-weight:700;
}

.empty-box{
    text-align:center;
    padding:35px 15px;
    color:#64748b;
}

/* ================= BOTTOM NAV ================= */

.mobile-bottom-nav{
    display:none;
}

/* ================= LOADING ================= */

.loading{
    text-align:center;
    padding:70px 20px;
    color:#64748b;
}

/* ================= TABLET ================= */

@media(max-width:850px){

    .stats-grid{
        grid-template-columns:1fr 1fr;
    }

    .content-grid{
        grid-template-columns:1fr;
    }
}

/* ================= MOBILE ================= */

@media(max-width:600px){

    body{
        background:#f8fafc;
    }

    .dashboard{
        padding:12px 12px 92px;
    }

    .top-actions{
        margin-bottom:14px;
    }

    .brand{
        font-size:19px;
    }

    .logout-btn{
        padding:8px 12px;
        font-size:12px;
    }

    .dashboard-header{
        padding:21px;
        border-radius:19px;
        margin-bottom:14px;
    }

    .dashboard-header h1{
        font-size:21px;
    }

    .dashboard-header p{
        font-size:12px;
    }

    /* 2 x 2 stats */

    .stats-grid{
        grid-template-columns:1fr 1fr;
        gap:10px;
        margin-bottom:14px;
    }

    .stat-card{
        padding:14px;
        border-radius:15px;
    }

    .stat-icon{
        font-size:21px;
        margin-bottom:6px;
    }

    .stat-card small{
        font-size:11px;
    }

    .stat-card strong{
        font-size:17px;
    }

    /* Account first */

    .content-grid{
        display:flex;
        flex-direction:column;
        gap:14px;
    }

    .panel{
        padding:16px;
        border-radius:18px;
    }

    .panel h2{
        font-size:17px;
    }

    .panel-subtitle{
        font-size:12px;
        margin-bottom:14px;
    }

    .user-row{
        flex-direction:column;
        gap:4px;
        padding:11px 0;
    }

    .user-row strong{
        text-align:left;
        font-size:12px;
    }

    /*
       Quick Actions first four:
       Wallet / Earnings / Tasks / Referral
    */

    .action-grid{
        grid-template-columns:1fr 1fr;
        gap:9px;
    }

    .main-action{
        min-height:76px;
        border-radius:13px;
    }

    .main-action .action-icon{
        font-size:24px;
    }

    .main-action .action-name{
        font-size:12px;
    }

    .secondary-action{
        min-height:48px;
        font-size:12px;
        background:#f8fafc;
        border:1px solid #e2e8f0;
    }

    /* Bottom navigation */

    .mobile-bottom-nav{
        position:fixed;
        display:flex;
        left:0;
        right:0;
        bottom:0;
        height:68px;
        background:rgba(255,255,255,.97);
        border-top:1px solid #e2e8f0;
        box-shadow:0 -5px 20px rgba(15,23,42,.08);
        z-index:9999;
        justify-content:space-around;
        align-items:center;
        padding:5px 4px;
    }

    .mobile-bottom-nav a,
    .mobile-bottom-nav button{
        flex:1;
        height:58px;
        border:0;
        background:none;
        text-decoration:none;
        color:#64748b;
        display:flex;
        flex-direction:column;
        justify-content:center;
        align-items:center;
        gap:3px;
        font-size:10px;
        font-weight:700;
        cursor:pointer;
    }

    .mobile-bottom-nav .nav-icon{
        font-size:20px;
    }

    .mobile-bottom-nav .active{
        color:#2563eb;
    }

    .video-box iframe{
        height:220px;
    }

    .task-card{
        padding:15px;
    }
}

/* ================= SMALL MOBILE ================= */

@media(max-width:380px){

    .dashboard{
        padding-left:9px;
        padding-right:9px;
    }

    .stat-card strong{
        font-size:15px;
    }

    .main-action{
        min-height:70px;
    }

    .main-action .action-icon{
        font-size:21px;
    }

    .main-action .action-name{
        font-size:11px;
    }
}
</style>
</head>

<body>

<div id="app">
    <div class="loading">
        Loading your account...
    </div>
</div>

<script>

let currentUser = null;


/* ================= LOAD DASHBOARD ================= */

async function loadPage(){

    try{

        const response = await fetch("/api/me",{
            method:"GET",
            credentials:"include"
        });

        const data = await response.json();

        if(response.ok && data.success && data.user){

            currentUser = data.user;

            showDashboard(data.user);

        }else{

            window.location.href="login.html";
        }

    }catch(error){

        console.error(error);

        document.getElementById("app").innerHTML=`

            <div class="dashboard">

                <div class="panel">

                    <h2>Unable to load dashboard</h2>

                    <p class="panel-subtitle">
                        Please make sure the server is running.
                    </p>

                    <button
                        class="action-btn"
                        onclick="loadPage()">
                        Try Again
                    </button>

                </div>

            </div>
        `;
    }
}


/* ================= DASHBOARD ================= */

   const balance =

const totalDeposit =

    ).toFixed(2);

const active =

    document.getElementById("app").innerHTML=`

        <div class="dashboard">

                </button>

            <!-- WELCOME -->

                    Your Watch & Earn account dashboard
                </p>

                        Wallet Balance
                    </small>

                    </strong>

                </div>


                <div class="stat-card">

                    <div class="stat-icon">🎬</div>

                    <small>
                        Today's Tasks
                    </small>

                    <strong id="taskCount">
                        ...
                    </strong>

                </div>


                <div class="stat-card">

                    <div class="stat-icon">📈</div>

                    <small>
                        Today's Earning
                    </small>

                    <strong id="todayEarning">
                        Rs. 0.00
                    </strong>

                </div>

<div class="stat-card">

    <div class="stat-icon">💳</div>

    <small>
        Total Deposit
    </small>

    <strong id="totalDeposit">
        Rs. ${totalDeposit}
    </strong>

</div>
                <div class="stat-card">

                    <div class="stat-icon">
                        ${active ? "✅" : "🔒"}
                    </div>

                    <small>
                        Account Status
                    </small>

                    <strong class="${active ? "status-active" : "status-inactive"}">
                        ${active ? "Active" : "Inactive"}
                    </strong>

                </div>

            </div>


            <!-- CONTENT -->

            <div class="content-grid">


               


                <!-- QUICK ACTIONS -->

                <div class="panel">

                    <h2>
                        Quick Actions
                    </h2>

                    <div class="panel-subtitle">
                        Manage your account and earning activities
                    </div>


                    <div class="action-grid">

                        <!-- WALLET -->

                        <a
                            href="wallet.html"
                            class="action-btn main-action">

                            <span class="action-icon">
                                💰
                            </span>

                            <span class="action-name">
                                Wallet
                            </span>

                        </a>


                        <!-- EARNINGS -->

                        <a
                            href="earnings.html"
                            class="action-btn main-action">

                            <span class="action-icon">
                                📈
                            </span>

                            <span class="action-name">
                                Earnings
                            </span>

                        </a>


                        <!-- TASKS -->

                        <button
                            class="action-btn main-action"
                            onclick="openTasks()">

                            <span class="action-icon">
                                🎬
                            </span>

                            <span class="action-name">

                        <!-- REFERRALS -->

                        <a
                            href="referral.html"

                            <span class="action-icon">

                            <span class="action-name">
                                Referrals
                            </span>

                        </a>
<!-- PROFILE -->

<a
    href="profile.html"

</a>

/* ================= TASK COUNT ================= */

async function loadTaskCount(){

    try{

        const response =
            await fetch("/api/tasks",{
                credentials:"include"
            });

        const data =
            await response.json();

        const element =
            document.getElementById("taskCount");

        if(element){

            element.textContent =
                data.success && data.tasks
                ? data.tasks.length
                : "0";
        }

    }catch(error){

        const element =
            document.getElementById("taskCount");

        if(element){
            element.textContent="0";
        }
    }
}


/* ================= TODAY EARNING ================= */
 
async function loadTodayEarning(){

    try{

        const response =
            await fetch("/api/history",{
                credentials:"include"
            });

        const data =
            await response.json();

        if(!response.ok || !data.success){
            return;
        }

        let total = 0;

        const today =
            new Date().toISOString().slice(0,10);

        data.transactions.forEach(transaction=>{

            if(
                transaction.type === "earning" &&
                Number(transaction.amount) > 0
            ){

                const transactionDate =
                    String(
                        transaction.created_at ||
                        transaction.date ||
                        ""
                    ).slice(0,10);

                if(transactionDate === today){

                    total += Number(transaction.amount);

                }
            }

        });

        const element =
            document.getElementById("todayEarning");

        if(element){

            element.textContent =
                "Rs. " + total.toFixed(2);

        }

    }catch(error){

        console.error(
            "Today earning error:",
            error
        );
    }
}


/* ================= OPEN TASKS ================= */

async function openTasks(){

    try{

        const response =
            await fetch("/api/tasks",{
                credentials:"include"
            });

        const data =
            await response.json();

        if(!response.ok || !data.success){

            alert(
                data.message ||
                "Unable to load tasks."
            );

            return;
        }

        if(!data.tasks || data.tasks.length === 0){

            document.getElementById("app").innerHTML=`

                <div class="dashboard">

                    <div class="top-actions">

                        <div class="brand">
                            Watch <span>&</span> Earn
                        </div>

                        <button
                            class="back-btn"
                            onclick="loadPage()">
                            ← Dashboard
                        </button>

                    </div>


                    <div class="panel">

                        <h2>
                            🎬 Today's Video Tasks
                        </h2>

                        <div class="panel-subtitle">
                            Complete available videos and claim your rewards.
                        </div>


                        <div class="empty-box">

                            <h3>
                                No Tasks Available
                            </h3>

                            <p>
                                Admin ne abhi koi video task add nahi kiya.
                            </p>

                        </div>

                    </div>

                </div>
            `;

            return;
        }

        const tasksHTML =
            data.tasks
            .map(task => createTaskHTML(task))
            .join("");

        document.getElementById("app").innerHTML=`

            <div class="dashboard">

                <div class="top-actions">

                    <div class="brand">
                        Watch <span>&</span> Earn
                    </div>

                    <button
                        class="back-btn"
                        onclick="loadPage()">
                        ← Dashboard
                    </button>

                </div>


                <div class="panel">

                    <h2>
                        🎬 Today's Video Tasks
                    </h2>

                    <div class="panel-subtitle">
                        Watch the required duration, then claim your reward.
                    </div>


                    ${tasksHTML}

                </div>

            </div>
        `;

        checkCompletedTasks(data.tasks);

    }catch(error){

        console.error(
            "Tasks error:",
            error
        );

        alert(
            "Unable to load video tasks."
        );
    }
}


/* ================= TASK HTML ================= */

function createTaskHTML(task){

    return `

        <div
            class="task-card"
            id="task-card-${task.id}">

            <h3>
                🎬 ${escapeHTML(task.title)}
            </h3>


            <div class="task-info">

                Reward:
                <strong>
                    Rs. ${Number(task.reward).toFixed(2)}
                </strong>

                &nbsp; | &nbsp;

                Duration:
                <strong>
                    ${Number(task.duration_minutes)} minute(s)
                </strong>

            </div>


            <button
                class="watch-btn"
                id="watch-${task.id}"
                onclick="watchTask(
                    '${encodeURIComponent(task.youtube_url)}',
                    ${task.id},
                    ${Number(task.duration_minutes)},
                    ${Number(task.reward)}
                )">

                ▶ Watch Video

            </button>


            <div
                class="timer-box"
                id="timer-${task.id}">

                ⏱️ Please watch:
                <span id="timer-text-${task.id}">
                    ${Number(task.duration_minutes)}:00
                </span>

            </div>


            <div
                class="video-box"
                id="video-${task.id}">
            </div>


            <div
                class="claim-area"
                id="claim-area-${task.id}">

                <button
                    class="claim-btn"
                    id="claim-${task.id}"
                    onclick="claimReward(${task.id})"
                    disabled>

                    🔒 Claim Reward

                </button>

            </div>


            <div
                class="success-message"
                id="success-${task.id}">
            </div>

        </div>
    `;
}


/* ================= WATCH TASK ================= */

async function watchTask(
    encodedURL,
    taskId,
    durationMinutes,
    reward
){

    const watchButton =
        document.getElementById(
            "watch-"+taskId
        );

    if(!watchButton){
        return;
    }

    watchButton.disabled = true;
    watchButton.textContent = "Starting...";

    try{

        const response =
            await fetch(
                "/api/tasks/"+taskId+"/start",
                {
                    method:"POST",
                    headers:{
                        "Content-Type":"application/json"
                    },
                    credentials:"include"
                }
            );

        const data =
            await response.json();

        /*
         * ==========================================
         * ALREADY CLAIMED
         * ==========================================
         */

        if(
            data.success &&
            data.status === "claimed"
        ){

            watchButton.disabled = true;

            watchButton.textContent =
                "✅ Reward Claimed";

            const videoBox =
                document.getElementById(
                    "video-"+taskId
                );

            if(videoBox){
                videoBox.style.display = "none";
                videoBox.innerHTML = "";
            }

            const timerBox =
                document.getElementById(
                    "timer-"+taskId
                );

            if(timerBox){
                timerBox.style.display = "none";
            }

            const claimArea =
                document.getElementById(
                    "claim-area-"+taskId
                );

            if(claimArea){
                claimArea.style.display = "block";
            }

            const claimButton =
                document.getElementById(
                    "claim-"+taskId
                );

            if(claimButton){

                claimButton.disabled = true;

                claimButton.textContent =
                    "✅ Reward Claimed";
            }

            const successElement =
                document.getElementById(
                    "success-"+taskId
                );

            if(successElement){

                successElement.style.display = "block";

                successElement.textContent =
                    "✅ Reward already claimed for this video.";
            }

            return;
        }

        /*
         * ==========================================
         * ALREADY COMPLETED
         * ==========================================
         */

        if(
            data.success &&
            data.status === "completed"
        ){

            watchButton.disabled = true;

            watchButton.textContent =
                "✅ Completed";

            const videoBox =
                document.getElementById(
                    "video-"+taskId
                );

            if(videoBox){
                videoBox.style.display = "none";
                videoBox.innerHTML = "";
            }

            const timerBox =
                document.getElementById(
                    "timer-"+taskId
                );

            if(timerBox){
                timerBox.style.display = "block";
            }

            const timerText =
                document.getElementById(
                    "timer-text-"+taskId
                );

            if(timerText){
                timerText.textContent =
                    "Completed ✓";
            }

            const claimArea =
                document.getElementById(
                    "claim-area-"+taskId
                );

            if(claimArea){
                claimArea.style.display = "block";
            }

            const claimButton =
                document.getElementById(
                    "claim-"+taskId
                );

            if(claimButton){

                claimButton.disabled = false;

                claimButton.textContent =
                    "💰 Claim Rs. " +
                    Number(
                        data.reward || reward
                    ).toFixed(2);
            }

            return;
        }

        /*
         * ==========================================
         * NORMAL START ERROR
         * ==========================================
         */

        if(
            !response.ok ||
            !data.success
        ){

            watchButton.disabled = false;

            watchButton.textContent =
                "▶ Watch Video";

            alert(
                data.message ||
                "Unable to start video."
            );

            return;
        }

        /*
         * ==========================================
         * YOUTUBE VIDEO
         * ==========================================
         */

        const youtubeURL =
            decodeURIComponent(encodedURL);

        const embedURL =
            getYouTubeEmbedURL(
                youtubeURL
            );

        const videoBox =
            document.getElementById(
                "video-"+taskId
            );

        if(!embedURL){

            watchButton.disabled = false;

            watchButton.textContent =
                "▶ Watch Video";

            alert(
                "This YouTube link is invalid. Please contact support."
            );

            return;
        }

        if(videoBox){

            videoBox.style.display = "block";

            videoBox.innerHTML = `

                <iframe
                    id="youtube-frame-${taskId}"
                    src="${embedURL}"
                    title="Watch Video"
                    width="100%"
                    height="315"
                    frameborder="0"
                    loading="lazy"
                    referrerpolicy="strict-origin-when-cross-origin"
                    allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
                    allowfullscreen>
                </iframe>

            `;
        }

        /*
         * ==========================================
         * TIMER / CLAIM AREA
         * ==========================================
         */

        const timerBox =
            document.getElementById(
                "timer-"+taskId
            );

        const timerText =
            document.getElementById(
                "timer-text-"+taskId
            );

        const claimArea =
            document.getElementById(
                "claim-area-"+taskId
            );

        const claimButton =
            document.getElementById(
                "claim-"+taskId
            );

        if(timerBox){
            timerBox.style.display = "block";
        }

        if(claimArea){
            claimArea.style.display = "block";
        }

        let remaining =
            Number(
                data.remaining_seconds
            );

        if(
            !Number.isFinite(remaining) ||
            remaining < 1
        ){

            remaining =
                Number(durationMinutes) * 60;
        }

        watchButton.textContent =
            "▶ Video Started";

        /*
         * ==========================================
         * TIMER
         * ==========================================
         */

        const timer =
            setInterval(
                () => {

                    remaining--;

                    if(timerText){

                        const minutes =
                            Math.floor(
                                remaining / 60
                            );

                        const seconds =
                            remaining % 60;

                        timerText.textContent =
                            minutes +
                            ":" +
                            String(seconds)
                                .padStart(2,"0");
                    }

                    if(remaining <= 0){

                        clearInterval(timer);

                        if(timerText){

                            timerText.textContent =
                                "Completed ✓";
                        }

                        if(claimButton){

                            claimButton.disabled =
                                false;

                            claimButton.textContent =
                                "💰 Claim Rs. " +
                                Number(
                                    reward
                                ).toFixed(2);
                        }

                        if(timerBox){

                            timerBox.style.background =
                                "#f0fdf4";

                            timerBox.style.color =
                                "#15803d";
                        }

                    }

                },
                1000
            );

    }catch(error){

        console.error(
            "Start video error:",
            error
        );

        watchButton.disabled = false;

        watchButton.textContent =
            "▶ Watch Video";

        alert(
            "Unable to start video. Please try again."
        );
    }
}

/* ================= YOUTUBE ================= */

function getYouTubeEmbedURL(url){

    try{

        if(!url){
            return null;
        }

        url = String(url).trim();

        // Agar admin ne direct video ID dali ho
        if(
            /^[a-zA-Z0-9_-]{11}$/.test(url)
        ){

            return (
                "https://www.youtube.com/embed/" +
                url +
                "?rel=0&playsinline=1"
            );
        }


        // URL mein protocol na ho to add karo
        if(
            !url.startsWith("http://") &&
            !url.startsWith("https://")
        ){

            url = "https://" + url;
        }


        const parsed =
            new URL(url);

        const hostname =
            parsed.hostname.toLowerCase();

        const pathname =
            parsed.pathname;


        let videoId = "";


        /* ================= YOUTUBE.COM ================= */

        if(
            hostname === "youtube.com" ||
            hostname === "www.youtube.com" ||
            hostname === "m.youtube.com"
        ){

            // https://www.youtube.com/watch?v=XXXXXXXXXXX

            if(
                pathname === "/watch"
            ){

                videoId =
                    parsed.searchParams.get("v") || "";

            }


            // https://www.youtube.com/shorts/XXXXXXXXXXX

            else if(
                pathname.startsWith("/shorts/")
            ){

                videoId =
                    pathname
                    .split("/shorts/")[1]
                    .split("/")[0];

            }


            // https://www.youtube.com/embed/XXXXXXXXXXX

            else if(
                pathname.startsWith("/embed/")
            ){

                videoId =
                    pathname
                    .split("/embed/")[1]
                    .split("/")[0];

            }


            // https://www.youtube.com/live/XXXXXXXXXXX

            else if(
                pathname.startsWith("/live/")
            ){

                videoId =
                    pathname
                    .split("/live/")[1]
                    .split("/")[0];

            }

        }


        /* ================= YOUTU.BE ================= */

        else if(
            hostname === "youtu.be"
        ){

            videoId =
                pathname
                .replace(/^\/+/,"")
                .split("/")[0];

        }


        /* ================= VALIDATE ID ================= */

        videoId =
            String(videoId)
            .trim()
            .split("?")[0]
            .split("&")[0];


        if(
            !/^[a-zA-Z0-9_-]{11}$/.test(videoId)
        ){

            console.error(
                "Invalid YouTube video ID:",
                videoId,
                "Original URL:",
                url
            );

            return null;
        }


        /* ================= EMBED URL ================= */

        return (
            "https://www.youtube.com/embed/" +
            encodeURIComponent(videoId) +
            "?rel=0&playsinline=1"
        );


    }catch(error){

        console.error(
            "YouTube URL Error:",
            error
        );

        return null;
    }
}

/* ================= ESCAPE HTML ================= */

function escapeHTML(value){

    return String(value ?? "")
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;")
        .replace(/'/g,"&#039;");
}
