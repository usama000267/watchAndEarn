<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Support - Watch & Earn</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
    font-family:Arial,sans-serif;
}

body{
    background:#f5f7fb;
    min-height:100vh;
    padding:20px;
}

.container{
    max-width:500px;
    margin:40px auto;
}

.card{
    background:white;
    border-radius:20px;
    padding:30px 22px;
    box-shadow:0 8px 25px rgba(0,0,0,0.08);
    text-align:center;
}

.icon{
    font-size:55px;
    margin-bottom:15px;
}

h1{
    color:#222;
    margin-bottom:10px;
}

.subtitle{
    color:#777;
    margin-bottom:25px;
}

.contact-box{
    background:#f1f5ff;
    border-radius:15px;
    padding:20px;
    margin-bottom:20px;
}

.contact-title{
    font-size:16px;
    color:#555;
    margin-bottom:8px;
}

.phone{
    font-size:22px;
    font-weight:bold;
    color:#222;
    margin-bottom:15px;
}

.telegram-btn{
    display:block;
    text-decoration:none;
    background:#229ED9;
    color:white;
    padding:14px;
    border-radius:12px;
    font-size:17px;
    font-weight:bold;
}

.telegram-btn:hover{
    opacity:.9;
}

.back-btn{
    display:block;
    margin-top:15px;
    text-decoration:none;
    color:#555;
    font-weight:bold;
}
</style>
</head>

<body>

<div class="container">

    <div class="card">

        <div class="icon">💬</div>

        <h1>Support Center</h1>

        <p class="subtitle">
            Need help? Contact our support team.
        </p>

        <div class="contact-box">

            <div class="contact-title">
                Telegram Helpline
            </div>

            <div class="phone">
                03499230392
            </div>

            <a href="https://t.me/watchandearn02"
               target="_blank"
               class="telegram-btn">
                ✈️ Open Telegram
            </a>

        </div>

        <a href="dashboard.html" class="back-btn">
            ← Back to Dashboard
        </a>

    </div>

</div>

</body>
</html>
