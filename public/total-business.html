<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Watch & Earn - Total Business</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            background: #f4f6f9;
            color: #222;
        }

        .header {
            background: #111827;
            color: white;
            padding: 18px 25px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .header h1 {
            font-size: 22px;
        }

        .back-btn {
            background: #374151;
            border: none;
            color: white;
            padding: 9px 16px;
            border-radius: 7px;
            cursor: pointer;
            font-weight: 600;
        }

        .container {
            padding: 25px;
            max-width: 1400px;
            margin: auto;
        }

        .business-card {
            background: white;
            border-radius: 14px;
            padding: 25px;
            margin-bottom: 25px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.08);
        }

        .business-card h2 {
            font-size: 18px;
            margin-bottom: 10px;
        }

        .business-amount {
            font-size: 32px;
            font-weight: 700;
        }

        .table-box {
            background: white;
            border-radius: 14px;
            padding: 20px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.08);
            overflow-x: auto;
        }

        .table-box h2 {
            margin-bottom: 18px;
            font-size: 20px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            min-width: 900px;
        }

        th,
        td {
            padding: 13px 12px;
            border-bottom: 1px solid #e5e7eb;
            text-align: left;
            white-space: nowrap;
        }

        th {
            background: #f9fafb;
            font-weight: 700;
        }

        .approved {
            display: inline-block;
            padding: 5px 10px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 700;
            background: #dcfce7;
            color: #166534;
        }

        .message {
            text-align: center;
            padding: 25px;
            color: #666;
        }

        @media (max-width: 600px) {
            .container {
                padding: 15px;
            }

            .header {
                padding: 15px;
            }

            .header h1 {
                font-size: 18px;
            }

            .business-amount {
                font-size: 27px;
            }
        }
    </style>
</head>

<body>

    <div class="header">
        <h1>Total Business</h1>

        <button
            type="button"
            class="back-btn"
            onclick="window.location.href='/admin'"
        >
            ← Back
        </button>
    </div>

    <div class="container">

        <div class="business-card">
            <h2>Total Business</h2>

            <div
                class="business-amount"
                id="totalBusiness"
            >
                Rs 0
            </div>
        </div>

        <div class="table-box">

            <h2>Approved Activation Payment History</h2>

            <table>

                <thead>
                    <tr>
                        <th>User</th>
                        <th>Email</th>
                        <th>Mobile</th>
                        <th>Amount</th>
                        <th>Payment Method</th>
                        <th>Reference</th>
                        <th>Date</th>
                        <th>Status</th>
                    </tr>
                </thead>

                <tbody id="businessHistory">

                    <tr>
                        <td
                            colspan="8"
                            class="message"
                        >
                            Loading...
                        </td>
                    </tr>

                </tbody>

            </table>

        </div>

    </div>

    <script>

        async function loadBusiness() {

            try {

                const response =
                    await fetch(
                        "/api/admin/total-business",
                        {
                            credentials: "include"
                        }
                    );

                const data =
                    await response.json();

                if (
                    !response.ok ||
                    !data.success
                ) {
                    throw new Error(
                        data.message ||
                        "Unable to load business."
                    );
                }

                document.getElementById(
                    "totalBusiness"
                ).textContent =
                    "Rs " +
                    Number(
                        data.totalBusiness || 0
                    ).toLocaleString();

                const tbody =
                    document.getElementById(
                        "businessHistory"
                    );

                const payments =
                    Array.isArray(data.payments)
                        ? data.payments
                        : [];

                if (payments.length === 0) {

                    tbody.innerHTML = `
                        <tr>
                            <td
                                colspan="8"
                                class="message"
                            >
                                No approved activation
                                payments found.
                            </td>
                        </tr>
                    `;

                    return;
                }

                tbody.innerHTML =
                    payments.map(payment => `

                        <tr>

                            <td>
                                ${escapeHtml(
                                    payment.full_name ||
                                    payment.username ||
                                    "-"
                                )}
                            </td>

                            <td>
                                ${escapeHtml(
                                    payment.email || "-"
                                )}
                            </td>

                            <td>
                                ${escapeHtml(
                                    payment.mobile || "-"
                                )}
                            </td>

                            <td>
                                Rs ${Number(
                                    payment.amount || 0
                                ).toLocaleString()}
                            </td>

                            <td>
                                ${escapeHtml(
                                    payment.payment_method ||
                                    "-"
                                )}
                            </td>

                            <td>
                                ${escapeHtml(
                                    payment.transaction_reference ||
                                    "-"
                                )}
                            </td>

                            <td>
                                ${
                                    payment.submitted_at
                                        ? new Date(
                                            payment.submitted_at
                                          ).toLocaleString()
                                        : "-"
                                }
                            </td>

                            <td>
                                <span class="approved">
                                    Approved
                                </span>
                            </td>

                        </tr>

                    `).join("");

            } catch (error) {

                console.error(
                    "TOTAL BUSINESS ERROR:",
                    error
                );

                document.getElementById(
                    "businessHistory"
                ).innerHTML = `
                    <tr>
                        <td
                            colspan="8"
                            class="message"
                        >
                            Unable to load business
                            history.
                        </td>
                    </tr>
                `;
            }
        }


        function escapeHtml(value) {

            return String(value)
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&#039;");
        }


        loadBusiness();

    </script>

</body>
</html>
